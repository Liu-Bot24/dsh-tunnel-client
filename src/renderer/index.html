<!doctype html>
<html lang="zh-CN" data-theme="whale-song">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>DSH Tunnel</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <svg class="svg-definitions" aria-hidden="true">
      <!-- CC0 source: https://www.svgrepo.com/svg/481245/whale -->
      <symbol id="whale-mark" viewBox="0 0 512 512">
        <path d="M509.643 147.547c-27.948 10.484-52.392 6.987-76.836 38.425-24.458-31.438-48.917-27.941-76.865-38.425-15.697 83.83 52.406 104.791 52.406 104.791l-24.817 42.512c-9.407 11.575-23.094 18.842-37.944 20.134-14.85 1.293-29.6-3.504-40.845-13.27l-58.955-56.837c-30.275-26.297-68.262-41.728-108.058-44.386v-75.78c.014-9.86 3.964-18.685 10.426-25.141 6.449-6.456 15.281-10.412 25.134-10.42 9.852.007 18.67 3.964 25.147 10.42 6.434 6.456 10.398 15.281 10.412 25.141-.014 7.058-2.039 13.564-5.558 19.079-2.916 4.581-1.58 10.656 2.987 13.579 4.582 2.916 10.656 1.572 13.587-2.995 5.458-8.566 8.631-18.792 8.631-29.664 0-30.505-24.703-55.207-55.207-55.222-18.829.007-35.416 9.436-45.384 23.812-9.967-14.376-26.555-23.805-45.384-23.812-30.504.015-55.206 24.716-55.206 55.222-.014 10.872 3.16 21.097 8.632 29.664 2.915 4.567 9.005 5.91 13.572 2.995 4.567-2.923 5.916-8.998 3.002-13.565v-.014c-3.519-5.515-5.558-12.021-5.558-19.079.014-9.86 3.964-18.685 10.412-25.141 6.478-6.456 15.296-10.412 25.147-10.42 9.838.007 18.671 3.964 25.134 10.42 6.449 6.456 10.412 15.281 10.412 25.141v75.234H90.566C50.065 199.946 0 235.52 0 295.351v71.156c0 42.044 27.503 76.002 80.857 76.002h251.849c37.384 0 71.033-22.706 85.022-57.375l39.524-132.797s68.118-20.961 52.391-104.79Z"/>
      </symbol>
    </svg>
    <div class="app-shell">
      <header class="app-toolbar">
        <div class="toolbar-brand">
          <svg class="brand-whale" viewBox="0 60 512 390" aria-hidden="true"><use href="#whale-mark"/></svg>
          <span>DSH Tunnel</span>
        </div>
        <div class="toolbar-actions">
          <button id="open-settings" class="icon-control" type="button" aria-label="设置" title="设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.8 2.8h4.4l.5 2a8 8 0 0 1 1.5.9l2-.6 2.2 3.8-1.5 1.4a8 8 0 0 1 0 1.8l1.5 1.4-2.2 3.8-2-.6a8 8 0 0 1-1.5.9l-.5 2H9.8l-.5-2a8 8 0 0 1-1.5-.9l-2 .6-2.2-3.8 1.5-1.4a8 8 0 0 1 0-1.8L3.6 8.9l2.2-3.8 2 .6a8 8 0 0 1 1.5-.9l.5-2Zm2.2 5.7a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>
          </button>
          <button id="add-endpoint" class="button primary toolbar-add" type="button"><span aria-hidden="true">＋</span>添加主机</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="endpoint-sidebar">
          <div class="sidebar-heading">
            <h2>主机</h2>
            <span id="endpoint-count">0</span>
          </div>
          <section id="endpoint-list" class="endpoint-list" role="listbox" aria-label="DSH 主机"></section>
          <section id="sidebar-empty" class="sidebar-empty hidden">
            <p>还没有添加主机</p>
            <button id="empty-add-endpoint" class="text-control" type="button">添加主机</button>
          </section>
        </aside>

        <section class="detail-pane">
          <section id="notice" class="notice hidden" role="status"></section>
          <section id="empty-state" class="empty-state hidden">
            <div class="empty-mark">＋</div>
            <h1>连接一台 DSH 主机</h1>
            <p>通过 SSH 访问目标电脑上的 DSH。</p>
            <button id="detail-add-endpoint" class="button primary" type="button">添加主机</button>
          </section>

          <article id="endpoint-detail" class="endpoint-detail hidden">
            <div class="theme-decoration" aria-hidden="true">
              <svg class="whale-decoration" viewBox="-18 0 548 472">
                <g class="whale-figure"><use href="#whale-mark"/></g>
                <g class="whale-bubbles">
                  <circle cx="103" cy="34" r="10"/>
                  <circle cx="136" cy="13" r="6"/>
                  <circle cx="166" cy="38" r="4"/>
                </g>
              </svg>
              <svg class="compass-decoration" viewBox="0 0 180 180"><circle cx="90" cy="90" r="72"/><circle cx="90" cy="90" r="46"/><path d="m90 18 9 63 63 9-63 9-9 63-9-63-63-9 63-9 9-63Z"/><path d="m90 52 11 27 27 11-27 11-11 27-11-27-27-11 27-11 11-27Z"/></svg>
              <div class="signal-circle"></div>
              <div class="signal-square"></div>
            </div>

            <header class="detail-heading">
              <div>
                <p id="detail-alias" class="detail-alias"></p>
                <h1 id="detail-name"></h1>
              </div>
              <div id="detail-status" class="status"><i></i><span>未连接</span></div>
            </header>

            <div class="detail-content">
              <section class="detail-group">
                <h2>连接</h2>
                <dl>
                  <div><dt>方式</dt><dd id="detail-method"></dd></div>
                  <div><dt id="detail-target-label">SSH</dt><dd id="detail-ssh"></dd></div>
                </dl>
              </section>
              <section id="tunnel-detail" class="detail-group">
                <h2>端口转发</h2>
                <dl>
                  <div><dt>本机</dt><dd id="detail-local"></dd></div>
                  <div><dt>远端</dt><dd id="detail-remote"></dd></div>
                </dl>
              </section>
              <section id="route-strip" class="route-strip" aria-label="端口转发路径">
                <div><span>本机浏览器</span><code id="route-local"></code></div>
                <div class="route-line"><i></i><span>SSH</span><i></i></div>
                <div><span>远端 DSH</span><code id="route-remote"></code></div>
              </section>
              <p id="endpoint-error" class="endpoint-error hidden"></p>
            </div>

            <footer class="detail-actions">
              <button id="edit-endpoint" class="button secondary" type="button">编辑</button>
              <button id="stop-tunnel" class="button secondary" type="button">断开</button>
              <button id="primary-endpoint-action" class="button primary" type="button">连接并打开</button>
            </footer>
          </article>
        </section>
      </main>
    </div>

    <dialog id="endpoint-dialog">
      <form id="endpoint-form">
        <div class="dialog-heading">
          <div>
            <h2 id="dialog-title">添加主机</h2>
          </div>
          <button id="close-dialog" class="icon-control" aria-label="关闭" type="button">×</button>
        </div>
        <input id="endpoint-id" type="hidden">
        <input id="endpoint-mode" type="hidden" value="ssh">
        <label>
          <span>显示名称</span>
          <input id="endpoint-name" required maxlength="80" placeholder="例如：工作电脑" autocomplete="off">
          <small class="field-note">仅用于本机识别。</small>
        </label>
        <div id="ssh-fields" class="ssh-fields">
          <label>
            <span>SSH 地址</span>
            <input id="ssh-host" required maxlength="255" placeholder="IP 地址或域名" autocomplete="off" spellcheck="false">
            <small class="field-note">也可使用 SSH 配置中的别名。</small>
          </label>
          <div class="field-row">
            <label>
              <span>SSH 用户（可选）</span>
              <input id="ssh-user" maxlength="80" placeholder="可不填" autocomplete="off" spellcheck="false">
              <small class="field-note">留空时使用 SSH 默认值。</small>
            </label>
            <label>
              <span>SSH 端口（可选）</span>
              <input id="ssh-port" inputmode="numeric" min="1" max="65535" placeholder="22">
              <small class="field-note">留空则使用 SSH 配置或 22。</small>
            </label>
          </div>
        </div>
        <div id="ports-row" class="field-row">
          <label id="dsh-port-field">
            <span id="dsh-port-label">DSH 端口</span>
            <input id="remote-port" required inputmode="numeric" min="1" max="65535" value="3080">
            <small id="dsh-port-note" class="field-note">SSH 目标侧可访问的 DSH 端口。</small>
          </label>
          <label id="local-port-field">
            <span>本地端口</span>
            <input id="local-port" required inputmode="numeric" min="1" max="65535" value="13080">
            <small class="field-note">本机浏览器访问 DSH 时使用的端口。</small>
          </label>
        </div>
        <div class="dialog-actions split-actions">
          <button id="delete-endpoint" class="button danger hidden" type="button">删除主机</button>
          <span></span>
          <button id="cancel-dialog" class="button secondary" type="button">取消</button>
          <button id="save-endpoint" class="button primary" value="default" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="pairing-dialog" class="pairing-dialog">
      <form id="pairing-form">
        <div class="dialog-heading">
          <div>
            <p class="dialog-kicker">首次连接</p>
            <h2 id="pairing-title">配对 SSH 主机</h2>
          </div>
          <button id="close-pairing" class="icon-control" aria-label="关闭" type="button">×</button>
        </div>
        <p class="pairing-intro">确认设备指纹并输入一次登录密码。配对完成后将使用专用密钥连接。</p>
        <section class="pairing-identity" aria-label="SSH 主机身份">
          <div><span>目标</span><code id="pairing-target"></code></div>
          <div><span id="pairing-key-type">主机指纹</span><code id="pairing-fingerprint"></code></div>
        </section>
        <label>
          <span>SSH 登录密码</span>
          <input id="pairing-password" type="password" required maxlength="1024" autocomplete="current-password">
          <small class="field-note">仅用于此次配对，不会保存。</small>
        </label>
        <p id="pairing-error" class="pairing-error hidden" role="alert"></p>
        <div class="dialog-actions">
          <button id="cancel-pairing" class="button secondary" type="button">取消</button>
          <button id="confirm-pairing" class="button primary" type="submit">确认并连接</button>
        </div>
      </form>
    </dialog>

    <dialog id="settings-dialog" class="settings-dialog">
      <form id="settings-form">
        <div class="dialog-heading">
          <div>
            <h2>主题</h2>
          </div>
          <button id="close-settings" class="icon-control" aria-label="关闭" type="button">×</button>
        </div>
        <fieldset class="theme-options">
          <legend>选择主题</legend>
          <label class="theme-option">
            <input type="radio" name="theme" value="whale-song">
            <span class="theme-preview whale-preview"><i></i><i></i><i></i></span>
            <span><strong>深海鲸歌</strong><small>深蓝背景与鲸影</small></span>
          </label>
          <label class="theme-option">
            <input type="radio" name="theme" value="nautical-chart">
            <span class="theme-preview nautical-preview"><i></i><i></i><i></i></span>
            <span><strong>航海图纸</strong><small>暖色纸张与海图网格</small></span>
          </label>
          <label class="theme-option">
            <input type="radio" name="theme" value="phosphor">
            <span class="theme-preview phosphor-preview"><i></i><i></i><i></i></span>
            <span><strong>夜视终端</strong><small>黑底与荧光绿</small></span>
          </label>
          <label class="theme-option">
            <input type="radio" name="theme" value="bauhaus-signal">
            <span class="theme-preview signal-preview"><i></i><i></i><i></i></span>
            <span><strong>包豪斯信号</strong><small>原色与几何分区</small></span>
          </label>
          <label class="theme-option">
            <input type="radio" name="theme" value="soft-porcelain">
            <span class="theme-preview porcelain-preview"><i></i><i></i><i></i></span>
            <span><strong>柔雾器物</strong><small>浅色陶瓷质感</small></span>
          </label>
        </fieldset>
        <div class="dialog-actions">
          <button id="cancel-settings" class="button secondary" type="button">取消</button>
          <button class="button primary" type="submit">保存主题</button>
        </div>
      </form>
    </dialog>

    <script src="./user-message.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
